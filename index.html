<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>COMANO Sneakers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <h1>COMANO <span>Sneakers</span></h1>
        <button class="cart-btn" @click="showCart = true">
          Carrello <span class="badge">{{ cartCount }}</span>
        </button>
      </header>

      <main class="page">
        <input v-model="search" type="search" placeholder="Cerca una scarpa..." />

        <div class="filters">
          <button v-for="c in categories" :key="c"
                  class="chip" :class="{ active: c === selectedCategory }"
                  @click="selectedCategory = c">
            {{ c }}
          </button>
        </div>

        <p v-if="filteredProducts.length === 0">Nessuna scarpa trovata.</p>

        <div class="products">
          <div class="card" v-for="p in filteredProducts" :key="p.id">
            <div class="gallery">
              <img v-for="(img, i) in p.images" :key="i" :src="img" :alt="p.name + ' foto ' + (i + 1)">
            </div>
            <h2>{{ p.name }}</h2>
            <p class="meta">{{ p.category }} · {{ p.price }} €</p>
            <div class="sizes">
              <button v-for="s in sizes" :key="s" class="chip"
                      :class="{ active: chosen[p.id] === s }"
                      @click="chosen[p.id] = s">
                {{ s }}
              </button>
            </div>
            <button class="add" :disabled="!chosen[p.id]" @click="addToCart(p)">
              {{ chosen[p.id] ? 'Aggiungi al carrello' : 'Scegli una taglia' }}
            </button>
          </div>
        </div>
      </main>

      <div class="overlay" v-if="showCart" @click="showCart = false"></div>

      <aside class="drawer" :class="{ open: showCart }" aria-label="Carrello">
        <div class="drawer-head">
          <h2>Il tuo carrello</h2>
          <button class="link" @click="showCart = false">Chiudi</button>
        </div>

        <p v-if="cart.length === 0">Il carrello è vuoto.</p>
        <ul v-else>
          <li v-for="(item, index) in cart" :key="item.id + '-' + item.size">
            <div>
              <strong>{{ item.name }}</strong>
              <small>Taglia {{ item.size }} · {{ item.price }} €</small>
            </div>
            <div class="qty">
              <button @click="changeQty(index, -1)" aria-label="Meno">−</button>
              <span>{{ item.qty }}</span>
              <button @click="changeQty(index, 1)" aria-label="Più">+</button>
            </div>
          </li>
        </ul>

        <div class="drawer-foot" v-if="cart.length">
          <div class="total"><span>Totale</span><strong>{{ cartTotal }} €</strong></div>
          <button class="add" @click="showCart = false">Continua gli acquisti</button>
          <button class="link" @click="clearCart">Svuota carrello</button>
        </div>
      </aside>

      <div class="toast" v-if="toast">{{ toast }}</div>
    </div>

    <script src="https://unpkg.com/vue@3"></script>
    <script src="main.js"></script>
  </body>
</html>
